<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Search Books</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">
                📚 <span>BookNest</span>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html" class="active">Search Books</a></li>
                <li><a href="shelf.html">My Shelf</a></li>
            </ul>
        </nav>
    </header>
    <!-- Search -->
    <main class="container">
        <section class="search-section">
            <h1>Search Books</h1>
            <p>
                Search books by title, author, or keyword using the Google Books API.
            </p>
            <form id="searchForm">
                <label for="bookSearch">
                    Book Title or Author
                </label>
                <input
                    type="text"
                    id="bookSearch"
                    placeholder="Enter a book title or author">
                <p id="validationMessage" class="validation-message"></p>
                <button type="submit">
                    Search Books
                </button>
            </form>
        </section>
        <!-- Messages -->
        <p id="loading" class="hidden">
            Loading books...
        </p>
        <p id="error" class="hidden">
            Unable to fetch books. Please try again.
        </p>
        <p id="noResults" class="hidden">
            No books found.
        </p>
        <!-- Search Results -->
        <section class="results-section">
            <center>
                <h2>Search Results</h2>
                <div id="results" class="results-grid">
                </div>
            </center>
        </section>
    </main>
    <!-- Footer -->
    <footer>
        <p>
            © 2026 BookNest | Book Finder & Reading Tracker
        </p>
    </footer>
    <script src="js/search.js"></script>
</body>
</html>
