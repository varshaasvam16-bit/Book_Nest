<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNest | Book Details</title>

    <link rel="stylesheet" href="css/details.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/6c4c8f41f7.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">
                📚 <span>BookNest</span>
            </div>

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="search.html">Search</a>
                </li>

                <li>
                    <a href="shelf.html">My Shelf</a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- Loading -->

        <div id="loading" class="loading">

            <i class="fas fa-spinner fa-spin"></i>

            <p>Loading Book...</p>

        </div>

        <!-- Error -->

        <div id="error" class="error hidden">

            <i class="fas fa-circle-exclamation"></i>

            <h2>Book Not Found</h2>

            <p>Please go back and search again.</p>

        </div>

        <!-- Book Card -->

        <section id="bookDetails" class="book-card hidden">

            <!-- Left -->

            <div class="book-image">

                <img id="bookCover" src="" alt="Book Cover">

            </div>

            <!-- Right -->

            <div class="book-info">

                <h1 id="title">
                    Loading...
                </h1>

                <p class="author">
                    <strong>Author:</strong>

                    <span id="author"></span>
                </p>

                <p>

                    <strong>Publisher:</strong>

                    <span id="publisher"></span>

                </p>

                <p>

                    <strong>Published:</strong>

                    <span id="publishedDate"></span>

                </p>

                <p>

                    <strong>Category:</strong>

                    <span id="category"></span>

                </p>

                <p>

                    <strong>Pages:</strong>

                    <span id="pages"></span>

                </p>

                <p>

                    <strong>Language:</strong>

                    <span id="language"></span>

                </p>

                <p>

                    <strong>Rating:</strong>

                    <span id="rating"></span>

                </p>

                <!-- Buttons -->

                <div class="buttons">

                    <button id="wantBtn" class="primary">

                        <i class="fas fa-bookmark"></i>

                        Want to Read

                    </button>

                    <button id="finishBtn" class="success">

                        <i class="fas fa-check-circle"></i>

                        Finished

                    </button>

                    <button id="readBtn" class="secondary" type="button">

                        <i class="fas fa-book-open"></i>

                        Read Book

                    </button>

                </div>

                <p id="readMessage" class="read-message hidden"></p>

                <!-- Description -->

                <div class="description">

                    <h2>Description</h2>

                    <p id="description">

                    </p>

                </div>

            </div>

        </section>

    </main>

    <!-- Toast -->

    <div id="toast" class="toast">

        Saved Successfully!

    </div>

    <!-- Footer -->

    <footer>

        <p>

            © 2026 BookNest | Book Finder & Reading Tracker

        </p>

    </footer>

    <script src="js/details.js"></script>

</body>

</html>
